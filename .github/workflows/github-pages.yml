# Sample workflow for building and deploying a Nuxt site to GitHub Pages
name: Deploy Nuxt site to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: 1 0 * * *
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Must run before setup-node: its pnpm cache calls `pnpm store path`.
      # The pnpm version comes from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static HTML export with Nuxt
        run: pnpm run generate
        env:
          NUXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ vars.NUXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          NUXT_PUBLIC_CONTENTFUL_ENVIRONMENT: ${{ vars.NUXT_PUBLIC_CONTENTFUL_ENVIRONMENT }}
          NUXT_PUBLIC_CONTENTFUL_APIKEY: ${{ vars.NUXT_PUBLIC_CONTENTFUL_APIKEY }}
          NUXT_PUBLIC_GTAG_ID: ${{ vars.NUXT_PUBLIC_GTAG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only the deploy job needs to write to Pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
