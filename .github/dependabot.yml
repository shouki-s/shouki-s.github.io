# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後に乗っ取られたパッケージを掴まないよう、公開から一定期間待つ
    # （セキュリティ更新はこの待ち時間の対象外）
    cooldown:
      default-days: 7
    # メジャー更新は移行作業が要るので、提案させずに手で計画して上げる
    # （update-types での除外はバージョン更新だけに効き、セキュリティ更新は届く）
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      # マイナー・パッチ更新は1本の PR にまとめる
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
